name: Publish stores

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. Choose none to publish the version already on main.
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: publish-stores
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Only junetic can publish
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "junetic" ]; then
            echo "Publish stores can only be run by junetic. This run was started by ${ACTOR}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm typecheck

      - name: Set version
        id: version
        run: node --experimental-strip-types scripts/bump-version.ts "${{ inputs.bump }}"

      - name: Commit version bump
        if: inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release ${{ steps.version.outputs.version }}."
          git tag "v${{ steps.version.outputs.version }}"
          branch="release/${{ steps.version.outputs.version }}"
          git push origin HEAD:"refs/heads/${branch}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh pr create --base main --head "${branch}" --title "Release ${{ steps.version.outputs.version }}" --body "Version bump for the store release. Merge this so main matches the published package."
        env:
          GH_TOKEN: ${{ github.token }}

      - run: pnpm zip

      - run: pnpm zip:firefox

      - run: node --experimental-strip-types scripts/check-store-packages.ts

      - name: Publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: node --experimental-strip-types scripts/publish-chrome-store.ts

      - name: Publish to Firefox Add-ons
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node --experimental-strip-types scripts/publish-firefox.ts
